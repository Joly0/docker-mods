name: Build Image

# Publishes the mod to ghcr.io/<owner>/docker-mods:steam-remoteplay
# (for example DOCKER_MODS=ghcr.io/joly0/docker-mods:steam-remoteplay).
# Weekly rebuild picks up new Debian gamescope sources; once Debian ships
# gamescope >= 3.16.31 the image simply carries no patched package.

on:
  push:
    branches: [steam-remoteplay]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

env:
  MODNAME: "steam-remoteplay"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${MODNAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}
            ${{ steps.name.outputs.image }}-${{ github.sha }}
