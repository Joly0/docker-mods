name: Build Image

# Publishes the mod to ghcr.io/<owner>/docker-mods:orcaslicer-mcp
# (for example DOCKER_MODS=ghcr.io/joly0/docker-mods:orcaslicer-mcp).
# Weekly rebuild picks up a new uv. The OrcaSlicer MCP build and the MCP
# server are fetched at container start, so they need no rebuild.

on:
  push:
    branches: [orcaslicer-mcp]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

env:
  MODNAME: "orcaslicer-mcp"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${MODNAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}
            ${{ steps.name.outputs.image }}-${{ github.sha }}
